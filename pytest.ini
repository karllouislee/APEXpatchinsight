[pytest]
# Collect only this project's suite: the workspace root also hosts unrelated
# material (another project folder, source archives) that pytest would
# otherwise pick up and fail on.
testpaths = tests
norecursedirs = .venv .git .workbuddy workspace data .backup_before_csv_only .backup_before_refactor
python_files = test_*.py
python_classes = Test*
python_functions = test_*
